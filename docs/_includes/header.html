<header class="site-header" role="banner">
  <div class="wrapper site-header__inner">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">AuthKit</a>
    {% assign alts = page.alt_lang | default: site.alt_lang %} {% assign here = page.url %}
    <nav class="site-nav">
      <a
        href="{{ alts.en | relative_url }}"
        {%
        if
        here=""
        ="alts.en"
        %}aria-current="page"
        {%
        endif
        %}
        >EN</a
      >
      <a
        href="{{ alts.pt | relative_url }}"
        {%
        if
        here=""
        ="alts.pt"
        %}aria-current="page"
        {%
        endif
        %}
        >PT</a
      >
      <a
        href="{{ alts.es | relative_url }}"
        {%
        if
        here=""
        ="alts.es"
        %}aria-current="page"
        {%
        endif
        %}
        >ES</a
      >
      <a href="https://github.com/carloshenriquecarniatto/AuthKit">GitHub</a>
    </nav>
  </div>
</header>
